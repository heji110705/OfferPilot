<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>OfferPilot · 网申领航 — AI 校招网申工作台</title>
<meta name="description" content="从档案到投递：AI 帮你解析 JD、定制简历、一键填写网申表单、管理投递进度。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M9 20l7-11 7 11' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>

<div class="app-shell">

  <!-- ============ 侧边栏（桌面） ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 17.5 12 5l7 12.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 17.5h6.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <strong>OfferPilot</strong>
        <span>网申领航</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <div class="side-card">
        <div class="side-card-title">档案完整度</div>
        <div class="side-meter"><i id="sideMeter"></i></div>
        <div class="side-card-row">
          <span id="sideComplete">—</span>
          <a href="#/profile">去完善</a>
        </div>
      </div>
      <button class="side-user" id="sideUser">
        <span class="avatar" id="sideAvatar">林</span>
        <span class="side-user-meta">
          <strong id="sideName">—</strong>
          <em>2027 届 · 秋招中</em>
        </span>
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title" id="pageTitle">工作台</div>
      <div class="topbar-search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        <input id="globalSearch" type="search" placeholder="搜索企业、岗位或指令…" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="aiBtn" title="AI 助手">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
        </button>
        <button class="icon-btn" id="bellBtn" title="提醒">
          <svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <i class="dot" id="bellDot"></i>
        </button>
        <a class="btn btn-primary btn-sm only-desktop" href="#/apply">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建网申
        </a>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>
</div>

<!-- ============ 移动端底部导航 ============ -->
<nav class="tabbar" id="tabbar"></nav>

<!-- ============ 全局组件挂载点 ============ -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<!-- AI 抽屉 -->
<div class="drawer-mask" id="aiDrawerMask"></div>
<aside class="drawer" id="aiDrawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <span class="ai-orb sm"></span>
      <div><strong>OfferPilot AI</strong><em>WorkBuddy 智能体 · 在线</em></div>
    </div>
    <button class="icon-btn" id="aiDrawerClose" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="aiDrawerBody"></div>
  <div class="drawer-foot">
    <div class="chip-row" id="aiChips"></div>
    <form class="composer" id="aiForm">
      <textarea id="aiInput" rows="1" placeholder="描述你的需求，例如：帮我把字节的 JD 匹配到主简历"></textarea>
      <button class="send-btn" type="submit" aria-label="发送"><svg class="ic" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
    </form>
  </div>
</aside>

<script src="assets/js/ui.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/resumefields.js"></script>
<script src="assets/js/fieldschema.js"></script>
<script src="assets/js/optionmap.js"></script>
<script src="assets/js/resumematch.js"></script>
<script src="assets/js/jobdata.js"></script>
<script src="assets/js/queue.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/bridge.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/pdftext.js"></script>
<script src="assets/js/resumeparse.js"></script>
<script src="assets/js/importflow.js"></script>
<script src="assets/js/views/dashboard.js"></script>
<script src="assets/js/views/profile.js"></script>
<script src="assets/js/views/resumes.js"></script>
<script src="assets/js/views/jobs.js"></script>
<script src="assets/js/views/queue.js"></script>
<script src="assets/js/views/apply.js"></script>
<script src="assets/js/views/pipeline.js"></script>
<script src="assets/js/views/insights.js"></script>
<script src="assets/js/views/copilot.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/widget.js"></script>
</body>
</html>
